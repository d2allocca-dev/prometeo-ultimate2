services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/prometeo.db}
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT_SECRET}
      ZEUS_BOOTSTRAP_TOKEN: ${ZEUS_BOOTSTRAP_TOKEN:?Set a one-time bootstrap token}
      ACCESS_TOKEN_MINUTES: "10"
      TOTP_ISSUER: "Prometeo COSMO"
    volumes: ["prometeo-data:/data"]
    restart: unless-stopped
volumes:
  prometeo-data:
