name: Build debug APK

on:
  push:
    branches: [ "main", "upload-0.12.0-adaptive" ]
    paths:
      - "pom 0.12.0/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: "pom 0.12.0"
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prometeo-ultimate-0.12.0-debug
          path: "pom 0.12.0/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
